<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Thamizharasan R</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Self-contained styles so this page renders correctly from any URL depth. -->
    <style>
      :root {
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --link: #0066cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #f5f5f7;
          --muted: #a1a1a6;
          --link: #4da3ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      .code {
        margin: 0 0 12px;
        color: var(--link);
        font: 600 0.875rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 1.4rem + 3vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.035em;
      }
      p {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 22px;
        border-radius: 999px;
        background: #0071e3;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--link);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist</h1>
      <p>The link may be broken, or the page may have moved.</p>
      <a href="./">Back to the portfolio</a>
    </main>
  </body>
</html>
